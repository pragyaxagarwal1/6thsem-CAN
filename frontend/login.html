<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAN Attack Dashboard - Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap');

    :root {
      --matrix-green: #00ff66;
      --matrix-dark-green: #003300;
      --matrix-bg: #000;
      --error-red: #ff0033;
      --text-dim: #009933;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      background-color: var(--matrix-bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--matrix-green);
      overflow: hidden;
    }

    #matrix-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: #000;
    }

    .login-container {
      background: rgba(0, 15, 0, 0.9);
      border: 1px solid var(--matrix-green);
      padding: 50px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.2);
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .login-header {
      margin-bottom: 40px;
    }

    .login-header h1 {
      font-size: 28px;
      letter-spacing: 4px;
      margin-bottom: 12px;
      text-shadow: 0 0 15px var(--matrix-green);
    }

    .login-header p {
      color: var(--text-dim);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .form-group {
      margin-bottom: 25px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    input[type='password'] {
      width: 100%;
      padding: 14px 18px;
      background: #000;
      border: 1px solid var(--matrix-dark-green);
      color: var(--matrix-green);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    input[type='password']:focus {
      outline: none;
      border-color: var(--matrix-green);
      box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--matrix-green);
      border: none;
      color: #000;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 15px;
      text-transform: uppercase;
    }

    .login-btn:hover {
      background: #00ffaa;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.4);
    }

    .login-btn:active {
      transform: scale(0.96);
      filter: brightness(1.2);
    }

    .error-message {
      background: rgba(255, 0, 51, 0.1);
      border: 1px solid rgba(255, 0, 51, 0.3);
      color: var(--error-red);
      padding: 14px;
      font-size: 13px;
      margin-bottom: 25px;
      display: none;
    }

    .success-message {
      background: rgba(0, 255, 102, 0.1);
      border: 1px solid rgba(0, 255, 102, 0.3);
      color: var(--matrix-green);
      padding: 14px;
      font-size: 13px;
      margin-bottom: 25px;
      display: none;
    }

    .show {
      display: block;
    }

    .footer {
      text-align: center;
      color: var(--matrix-dark-green);
      font-size: 10px;
      margin-top: 30px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <!-- MATRIX BACKGROUND -->
  <canvas id="matrix-bg"></canvas>

  <div class="login-container">
    <div class="login-header">
      <h1>CAN_SECURE</h1>
      <p>EXPLOITATION INTERFACE ACCESS</p>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="password">ACCESS_KEY</label>
        <input type="password" id="password" name="password" placeholder="••••••••••••" required />
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        INITIALIZE_SESSION <span id="loadingSpinner" style="display: none; opacity: 0.5;">...</span>
      </button>
    </form>

    <div class="footer">
      <p>AUTHORIZED_PERSONNEL_ONLY</p>
      <p>© 2026 QUANTUM_CYBER_SYSTEMS</p>
    </div>
  </div>

  <script src="/js/matrix.js"></script>
  <script type="module" src="/js/login.js"></script>
</body>

</html>
