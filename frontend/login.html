<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAN Attack Dashboard - Login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
      }

      .login-container {
        background: rgba(22, 33, 62, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      .login-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .login-header h1 {
        font-size: 28px;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #00d4ff, #ff006e);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .login-header p {
        color: #aaa;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #e0e0e0;
      }

      input[type='password'] {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        color: #fff;
        font-size: 14px;
        transition: all 0.3s ease;
      }

      input[type='password']:focus {
        outline: none;
        border-color: #00d4ff;
        background: rgba(0, 212, 255, 0.05);
        box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
      }

      .login-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #00d4ff, #0099ff);
        border: none;
        border-radius: 8px;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
      }

      .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
      }

      .login-btn:active {
        transform: translateY(0);
      }

      .login-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .error-message {
        background: rgba(255, 0, 106, 0.1);
        border: 1px solid rgba(255, 0, 106, 0.3);
        color: #ff006e;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 20px;
        display: none;
      }

      .error-message.show {
        display: block;
      }

      .success-message {
        background: rgba(0, 212, 255, 0.1);
        border: 1px solid rgba(0, 212, 255, 0.3);
        color: #00d4ff;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 20px;
        display: none;
      }

      .success-message.show {
        display: block;
      }

      .loading {
        display: inline-block;
        width: 4px;
        height: 4px;
        background: #00d4ff;
        border-radius: 50%;
        animation: pulse 1.5s infinite;
        margin-left: 8px;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }

      .footer {
        text-align: center;
        color: #666;
        font-size: 12px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <h1>⚡ CAN Attack Dashboard</h1>
        <p>Real-time CAN Injection Control</p>
      </div>

      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="password">Master Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter dashboard password"
            required
          />
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          Sign In<span class="loading" id="loadingSpinner" style="display: none"></span>
        </button>
      </form>

      <div class="footer">
        <p>CAN Attack Control Dashboard v1.0</p>
        <p>© 2026 All rights reserved</p>
      </div>
    </div>

    <script>
      const loginForm = document.getElementById('loginForm');
      const passwordInput = document.getElementById('password');
      const loginBtn = document.getElementById('loginBtn');
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');
      const loadingSpinner = document.getElementById('loadingSpinner');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const password = passwordInput.value.trim();

        if (!password) {
          showError('Please enter a password');
          return;
        }

        // Disable button and show loading
        loginBtn.disabled = true;
        loadingSpinner.style.display = 'inline-block';

        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ password }),
          });

          const data = await response.json();

          if (response.ok && data.success) {
            // Store token in localStorage
            localStorage.setItem('dashboardToken', data.token);
            localStorage.setItem('loginTime', Date.now());

            showSuccess('Login successful! Redirecting...');

            setTimeout(() => {
              window.location.href = '/dashboard';
            }, 500);
          } else {
            showError(data.error || 'Login failed');
            loginBtn.disabled = false;
            loadingSpinner.style.display = 'none';
          }
        } catch (error) {
          console.error('Login error:', error);
          showError('Network error. Please try again.');
          loginBtn.disabled = false;
          loadingSpinner.style.display = 'none';
        }
      });

      function showError(msg) {
        errorMessage.textContent = msg;
        errorMessage.classList.add('show');
        successMessage.classList.remove('show');
      }

      function showSuccess(msg) {
        successMessage.textContent = msg;
        successMessage.classList.add('show');
        errorMessage.classList.remove('show');
      }

      // Check if already logged in
      if (localStorage.getItem('dashboardToken')) {
        window.location.href = '/dashboard';
      }

      // Clear password on page load
      passwordInput.value = '';
    </script>
  </body>
</html>
